name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest

  quality:
    name: Quality and security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src tests scripts
      - name: Static security audit
        run: bandit -c pyproject.toml -r src scripts
      - name: Dependency audit
        run: pip-audit .

  package:
    name: Build and validate package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Inspect artifacts
        env:
          DIST_DIR: dist
        run: pytest tests/test_distribution.py --no-cov
      - name: Install wheel in a clean environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/python -m pip install dist/*.whl
          .package-venv/bin/python - <<'PY'
          from flask import Flask
          from flask_ms_entra_auth import (
              AtomicAuthStorage,
              AuthEvent,
              AuthStorage,
              Identity,
              MemoryStorage,
              MicrosoftEntraAuth,
              SecurityReport,
              __version__,
          )

          from importlib.metadata import version

          app = Flask("package-smoke-test")
          app.secret_key = "package-smoke-session-secret"
          app.config.from_mapping(
              MS_ENTRA_CLIENT_ID="smoke-client",
              MS_ENTRA_CLIENT_SECRET="smoke-secret",
              MS_ENTRA_TENANT_ID="smoke.example.com",
              MS_ENTRA_REDIRECT_URI="https://smoke.example.com/auth/callback",
              MS_ENTRA_SESSION_NAMESPACE="package-smoke",
          )
          extension = MicrosoftEntraAuth()
          events = []
          extension.on_event(events.append)
          extension.init_app(app)
          assert "ms_entra_auth" in app.extensions
          state = app.extensions["ms_entra_auth"]
          state.storage.save("flow", b"payload", ttl=30)
          assert state.storage.load("flow") == b"payload"
          assert isinstance(MemoryStorage(), AuthStorage)
          assert isinstance(MemoryStorage(), AtomicAuthStorage)
          state.storage.save("atomic", b"once", ttl=30)
          assert state.storage.take("atomic") == b"once"
          assert state.storage.take("atomic") is None
          identity = Identity.from_claims(
              {"oid": "smoke-object", "tid": "smoke.example.com"},
              home_account_id="smoke-home",
              expected_tenant_id="smoke.example.com",
          )
          assert identity.stable_id == ("smoke.example.com", "smoke-object")
          assert state.msal.config is state.config
          report = extension.audit_security(app)
          assert isinstance(report, SecurityReport)
          state.observability.emit("package_smoke")
          assert isinstance(events[-1], AuthEvent)
          assert events[-1].name == "package_smoke"
          assert state.routes_registered is True
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          assert {"/auth/login", "/auth/callback", "/auth/logout"} <= routes
          assert version("flask-ms-entra-auth") == __version__
          PY
